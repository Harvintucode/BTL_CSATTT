# Docker's embedded DNS. Re-resolving "backend" lets nginx follow the container when it is
# recreated (e.g. `docker compose up -d backend` after changing LAB_MODE) instead of returning 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index login.html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    # Pages use inline <script>/<style> and no third-party resources.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;   # no URI part: the original /api/... path is forwarded unchanged
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = / { return 302 /login.html; }
    location ~* \.(?:html|css|js)$ { try_files $uri =404; }
    location / { return 404; }
}
