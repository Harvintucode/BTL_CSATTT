services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: novabank
      MYSQL_USER: novabank_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-lab_db_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab_root_password_change_me}
    volumes:
      - db_data:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 25
    # Intentionally NO ports mapping: DB is not published to the host.

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/novabank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: novabank_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-lab_db_password_change_me}
      APP_JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-to-at-least-32-characters}
      LAB_MODE: ${LAB_MODE:-fixed}
      APP_CORS_ALLOWED_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    # Intentionally NO ports mapping: only nginx can reach backend.

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [edge, private]

networks:
  edge:
  private:
    internal: true

volumes:
  db_data:
